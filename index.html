<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday Tega Oviri 🎂</title>
<meta property="og:title" content="Happy Birthday Tega Oviri 🎉" />
<meta property="og:image" content="tega1.jpg" />
<meta property="og:description" content="To the best brother in the world. Open this to celebrate!" />
<meta name="theme-color" content="#1b1340" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --night: #1b1340;
    --night-2: #2a1d63;
    --coral: #ff5d73;
    --gold: #ffc93c;
    --mint: #3ddbb0;
    --cream: #fff8ec;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Outfit', system-ui, sans-serif;
    color: var(--cream);
    background: radial-gradient(1200px 700px at 50% -10%, var(--night-2), var(--night) 70%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  /* floating balloons */
  .balloons { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .balloon {
    position: absolute; bottom: -140px; width: 54px; height: 66px; border-radius: 50% 50% 48% 48%;
    animation: rise linear infinite; opacity: .85;
  }
  .balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 60px; background: rgba(255,248,236,.4); }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0) rotate(-4deg); }
    50% { transform: translateY(-60vh) translateX(24px) rotate(4deg); }
    100% { transform: translateY(-125vh) translateX(-16px) rotate(-4deg); }
  }

  main { position: relative; z-index: 1; }
  .hero {
    min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 4rem 1.25rem 3rem; gap: 1rem;
  }
  .kicker { font-size: clamp(1rem, 3.5vw, 1.3rem); color: var(--gold); font-weight: 500; }
  h1 {
    font-family: 'Bagel Fat One', cursive; font-weight: 400; line-height: .95;
    font-size: clamp(3rem, 15vw, 8rem); letter-spacing: .01em;
  }
  .line { display: block; }
  .letter {
    display: inline-block; animation: bounce 2.4s ease-in-out infinite;
    background: linear-gradient(180deg, var(--gold), var(--coral)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .name .letter { background: linear-gradient(180deg, var(--mint), #7aa8ff); -webkit-background-clip: text; background-clip: text; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-.12em); } }
  .sub { font-size: clamp(1.1rem, 4vw, 1.6rem); max-width: 28ch; color: #ffeccc; }

  /* cake */
  .cake-wrap { position: relative; margin-top: .5rem; }
  .cake { width: min(260px, 70vw); height: auto; cursor: pointer; filter: drop-shadow(0 18px 30px rgba(0,0,0,.35)); }
  .flame { transform-origin: center bottom; animation: flicker .5s ease-in-out infinite alternate; transition: opacity .35s, transform .35s; }
  .out .flame { opacity: 0; transform: scale(.2); animation: none; }
  @keyframes flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.12, .94) rotate(3deg); } }
  .smoke { opacity: 0; }
  .out .smoke { animation: smoke 1.6s ease-out; }
  @keyframes smoke { 0% { opacity: .7; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }

  .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 1rem; }
  button { font: inherit; cursor: pointer; border: 0; }
  .btn {
    padding: .85rem 1.5rem; border-radius: 999px; font-weight: 600; font-size: 1.05rem;
    color: var(--night); background: var(--gold); transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 0 #c99a14;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99a14; }
  .btn.share { background: var(--mint); box-shadow: 0 6px 0 #1fa482; }
  .btn.share:active { box-shadow: 0 2px 0 #1fa482; }
  .btn:focus-visible, .secret:focus-visible, .close:focus-visible, .copy:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .btn.wa { background: #25d366; box-shadow: 0 6px 0 #17a04b; text-decoration: none; display: inline-block; text-align: center; }
  .btn.wa:active { box-shadow: 0 2px 0 #17a04b; }

  /* secret star */
  .secret {
    position: absolute; right: -34px; top: -8px; background: none; color: var(--gold); font-size: 1.5rem;
    animation: twinkle 3s ease-in-out infinite; opacity: .55; padding: .4rem;
  }
  .secret:hover { opacity: 1; }
  @keyframes twinkle { 0%, 100% { transform: scale(.85) rotate(0); opacity: .3; } 50% { transform: scale(1.15) rotate(30deg); opacity: .8; } }


  /* photos */
  .portrait { width: clamp(120px, 34vw, 170px); aspect-ratio: 1; border-radius: 50%; object-fit: cover; object-position: 50% 25%;
    border: 5px solid var(--gold); box-shadow: 0 0 0 6px rgba(255,201,60,.25), 0 14px 30px rgba(0,0,0,.4); animation: bounce 3s ease-in-out infinite; }
  .moments { max-width: 900px; margin: 0 auto; padding: 1rem 1.25rem 2rem; text-align: center; }
  .moments h2 { font-family: 'Bagel Fat One', cursive; font-weight: 400; font-size: clamp(1.8rem, 7vw, 3rem); color: var(--gold); margin-bottom: 2rem; }
  .polaroids { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }
  .polaroid { background: var(--cream); color: var(--night); padding: .7rem .7rem 1rem; border-radius: 6px; width: min(300px, 82vw);
    box-shadow: 0 18px 36px rgba(0,0,0,.4); transition: transform .3s; font-weight: 600; }
  .polaroid:nth-child(1) { transform: rotate(-4deg); }
  .polaroid:nth-child(2) { transform: rotate(3deg); }
  .polaroid:hover { transform: rotate(0) scale(1.04); }
  .polaroid img { width: 100%; aspect-ratio: 4/5; object-fit: cover; object-position: 50% 20%; display: block; border-radius: 3px; margin-bottom: .6rem; }

  /* wishes */
  .wishes { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
  .wishes h2 { font-family: 'Bagel Fat One', cursive; font-weight: 400; font-size: clamp(1.8rem, 7vw, 3rem); text-align: center; margin-bottom: 1.5rem; color: var(--gold); }
  .wish {
    display: flex; gap: 1rem; align-items: center; padding: 1.1rem 1.25rem; margin-bottom: 1rem; border-radius: 22px;
    background: rgba(255,248,236,.08); border: 1px solid rgba(255,248,236,.15); font-size: 1.1rem; line-height: 1.5;
  }
  .wish:nth-child(odd) { border-radius: 22px 22px 22px 6px; }
  .wish:nth-child(even) { border-radius: 22px 22px 6px 22px; flex-direction: row-reverse; text-align: right; }
  .wish .emoji { font-size: 2rem; flex: none; }
  footer { text-align: center; padding: 0 1rem 3rem; color: #d9cdf5; position: relative; z-index: 1; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,6,30,.75); display: grid; place-items: center; z-index: 60; padding: 1rem;
    animation: fade .25s ease-out; backdrop-filter: blur(4px);
  }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.7) rotate(-3deg); opacity: 0; } }
  .modal {
    width: min(420px, 100%); background: var(--cream); color: var(--night); border-radius: 28px; padding: 1.75rem 1.5rem;
    text-align: center; position: relative; animation: pop .4s cubic-bezier(.2,1.4,.4,1);
  }
  .modal h3 { font-family: 'Bagel Fat One', cursive; font-weight: 400; font-size: 1.8rem; margin-bottom: .25rem; }
  .modal p.note { margin-bottom: 1.25rem; color: #4b3f7d; }
  .field { background: #fff; border: 2px dashed #cdbff5; border-radius: 16px; padding: .8rem 1rem; margin-bottom: .75rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; text-align: left; }
  .field small { display: block; color: #6f64a0; font-size: .8rem; }
  .field strong { font-size: 1.2rem; word-break: break-all; }
  .copy { background: var(--night); color: var(--cream); padding: .5rem .95rem; border-radius: 999px; font-weight: 600; flex: none; transition: background .2s; }
  .copy.done { background: #1fa482; }
  .close { position: absolute; top: .6rem; right: .8rem; background: none; font-size: 1.6rem; color: var(--night); line-height: 1; padding: .3rem .5rem; }

  .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); background: var(--cream); color: var(--night); padding: .7rem 1.2rem; border-radius: 999px; font-weight: 600; z-index: 70; animation: pop .3s ease-out; }

  @media (max-width: 480px) { .secret { right: -26px; } .wish { font-size: 1rem; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const h = React.createElement;

/* ---------- Confetti engine (canvas) ---------- */
const confetti = (() => {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let parts = [], raf = null;
  const colors = ['#ffc93c', '#ff5d73', '#3ddbb0', '#7aa8ff', '#fff8ec', '#c77dff'];
  const resize = () => { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; };
  resize(); addEventListener('resize', resize);
  const tick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts.forEach(p => {
      p.vy += 0.12 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    parts = parts.filter(p => p.y < canvas.height + 40);
    raf = parts.length ? requestAnimationFrame(tick) : null;
    if (!raf) ctx.clearRect(0, 0, canvas.width, canvas.height);
  };
  return (x = 0.5, y = 0.5, count = 140) => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const d = devicePixelRatio;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, v = (4 + Math.random() * 9) * d;
      parts.push({ x: x * canvas.width, y: y * canvas.height, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5 * d,
        s: (7 + Math.random() * 8) * d, rot: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: colors[(Math.random() * colors.length) | 0] });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  };
})();

/* ---------- Helpers ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const t = document.createElement('textarea');
    t.value = text; t.style.position = 'fixed'; t.style.opacity = 0;
    document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    t.remove(); return ok;
  }
}

function Letters({ text, offset = 0 }) {
  return text.split('').map((ch, i) =>
    h('span', { key: i, className: 'letter', style: { animationDelay: `${(i + offset) * 0.12}s` } },
      ch === ' ' ? '\u00A0' : ch));
}

function Balloons() {
  const items = useMemo(() => {
    const cols = ['#ff5d73', '#ffc93c', '#3ddbb0', '#7aa8ff', '#c77dff'];
    return Array.from({ length: 12 }, (_, i) => ({
      left: `${(i * 8.5 + Math.random() * 6) % 96}%`,
      bg: cols[i % cols.length],
      dur: 14 + Math.random() * 12,
      delay: -Math.random() * 20,
      scale: .7 + Math.random() * .7,
    }));
  }, []);
  return h('div', { className: 'balloons', 'aria-hidden': 'true' },
    items.map((b, i) => h('span', { key: i, className: 'balloon',
      style: { left: b.left, background: b.bg, animationDuration: `${b.dur}s`, animationDelay: `${b.delay}s`, transform: `scale(${b.scale})` } })));
}

function Cake({ out, onToggle }) {
  const candles = [92, 130, 168];
  const cols = ['#3ddbb0', '#7aa8ff', '#c77dff'];
  return h('svg', {
      className: 'cake' + (out ? ' out' : ''), viewBox: '0 0 260 230', onClick: onToggle, role: 'button', tabIndex: 0,
      'aria-label': 'Birthday cake. Press to blow out the candles.',
      onKeyDown: e => { if (e.key === 'Enter' || e.key === ' ') onToggle(); } },
    h('ellipse', { cx: 130, cy: 214, rx: 120, ry: 12, fill: 'rgba(0,0,0,.25)' }),
    h('rect', { x: 30, y: 150, width: 200, height: 60, rx: 14, fill: '#ff5d73' }),
    h('rect', { x: 50, y: 100, width: 160, height: 56, rx: 14, fill: '#ffc93c' }),
    h('path', { d: 'M30 160 q15 22 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t20 0 v-10 h-200z', fill: '#fff8ec' }),
    h('path', { d: 'M50 108 q13 20 26 0 t26 0 t26 0 t26 0 t26 0 v-8 h-130z', fill: '#fff8ec' }),
    h('circle', { cx: 80, cy: 185, r: 5, fill: '#3ddbb0' }),
    h('circle', { cx: 130, cy: 190, r: 5, fill: '#ffc93c' }),
    h('circle', { cx: 180, cy: 185, r: 5, fill: '#7aa8ff' }),
    candles.map((x, i) =>
      h('g', { key: x },
        h('rect', { x: x - 5, y: 62, width: 10, height: 40, rx: 3, fill: cols[i] }),
        h('g', { className: 'flame', style: { animationDelay: `${i * .12}s` } },
          h('path', { d: `M${x} 28 q-11 16 0 30 q11 -14 0 -30z`, fill: '#ffb02e' }),
          h('path', { d: `M${x} 40 q-5 8 0 16 q5 -8 0 -16z`, fill: '#fff3a8' })),
        h('path', { className: 'smoke', d: `M${x} 55 q-8 -10 0 -20`, stroke: '#d9cdf5', strokeWidth: 3, fill: 'none', strokeLinecap: 'round' }))));
}

function SecretModal({ onClose, onToast }) {
  const [done, setDone] = useState(null);
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, [onClose]);
  useEffect(() => { confetti(0.5, 0.4, 120); }, []);

  const rows = [
    { k: 'num', label: 'Account number', value: '9128570541' },
    { k: 'bank', label: 'Bank', value: 'PalmPay' },
    { k: 'name', label: 'Account name', value: 'Tega Oviri' },
  ];
  const copy = async (k, v) => {
    const ok = await copyText(v);
    if (ok) { setDone(k); onToast(`Copied ${v}`); setTimeout(() => setDone(null), 1800); }
    else onToast('Copy failed. Press and hold to copy.');
  };
  return h('div', { className: 'overlay', onClick: onClose },
    h('div', { className: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Account details', onClick: e => e.stopPropagation() },
      h('button', { className: 'close', onClick: onClose, 'aria-label': 'Close' }, '×'),
      h('h3', null, 'You found the secret! 🎁'),
      h('p', { className: 'note' }, 'Birthday gifts are always welcome, Tega.'),
      rows.map(r =>
        h('div', { className: 'field', key: r.k },
          h('div', null, h('small', null, r.label), h('strong', null, r.value)),
          h('button', { className: 'copy' + (done === r.k ? ' done' : ''), onClick: () => copy(r.k, r.value) },
            done === r.k ? 'Copied ✓' : 'Copy'))),
      h('button', { className: 'btn', style: { marginTop: '.6rem' }, onClick: () => copy('all', 'Tega Oviri, PalmPay, 9128570541') },
        done === 'all' ? 'Copied ✓' : 'Copy all details')));
}

function App() {
  const [out, setOut] = useState(false);
  const [secret, setSecret] = useState(false);
  const [toast, setToast] = useState('');
  const toastTimer = useRef();

  const showToast = useCallback(msg => {
    setToast(msg); clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 2200);
  }, []);

  useEffect(() => {
    const t = setTimeout(() => { confetti(.2, .3, 80); confetti(.8, .3, 80); }, 500);
    return () => clearTimeout(t);
  }, []);

  const toggleCandles = () => {
    setOut(o => { if (!o) confetti(.5, .55, 180); return !o; });
  };

  const waLink = 'https://wa.me/2349128570541?text=' + encodeURIComponent('Happy birthday Tega 🎂🎉. Wishing you the best day ever 🥳🎁❤️');

  const shareText = "🎂 It's Tega's birthday! Come see the surprise page I made for the best brother in the world 🎉 There's a secret star ✦ hidden on it. Can you find it?";

  const share = () => {
    const link = 'https://wa.me/?text=' + encodeURIComponent(shareText + '\n' + location.href);
    window.open(link, '_blank', 'noopener');
  };

  const wishes = [
    ['🦸', 'You show up for everyone, and you make it look easy.'],
    ['😂', 'Nobody makes us laugh the way you do.'],
    ['💪', 'Strong, kind and always there. That is you.'],
    ['🌍', 'Best brother in the world.'],
  ];

  return h(React.Fragment, null,
    h(Balloons),
    h('main', null,
      h('section', { className: 'hero' },
        h('img', { className: 'portrait', src: 'tega1.jpg', alt: 'Tega Oviri' }),
        h('p', { className: 'kicker' }, "🎉 It's your day! 🎉"),
        h('h1', null,
          h('span', { className: 'line' }, h(Letters, { text: 'Happy' })),
          h('span', { className: 'line' }, h(Letters, { text: 'Birthday', offset: 5 })),
          h('span', { className: 'line name' }, h(Letters, { text: 'Tega Oviri', offset: 13 }))),
        h('p', { className: 'sub' }, 'To the best brother in the world.'),
        h('div', { className: 'cake-wrap' },
          h(Cake, { out, onToggle: toggleCandles }),
          h('button', { className: 'secret', onClick: () => setSecret(true), 'aria-label': 'Secret surprise', title: '✦' }, '✦')),
        h('p', { className: 'sub', style: { fontSize: '1rem', opacity: .8 } },
          out ? 'Wish granted! Tap the cake to relight.' : 'Tap the cake to blow out the candles.'),
        h('div', { className: 'actions' },
          h('button', { className: 'btn', onClick: () => confetti(.5, .5, 220) }, 'Pop the confetti 🎊'),
          h('button', { className: 'btn share', onClick: share }, 'Share the love 💌'),
          h('a', { className: 'btn wa', href: waLink, target: '_blank', rel: 'noopener', onClick: () => confetti(.5, .6, 120) }, 'Wish him a happy birthday 💬'))),

      h('section', { className: 'moments' },
        h('h2', null, 'Looking sharp, birthday boy'),
        h('div', { className: 'polaroids' },
          h('figure', { className: 'polaroid' },
            h('img', { src: 'tega1.jpg', alt: 'Tega in a white shirt and tie', loading: 'lazy' }),
            h('figcaption', null, 'Boss mode 😎')),
          h('figure', { className: 'polaroid' },
            h('img', { src: 'tega2.jpg', alt: 'Tega taking a mirror selfie in a jersey', loading: 'lazy' }),
            h('figcaption', null, 'Fresh fit 🔥')))),

      h('section', { className: 'wishes' },
        h('h2', null, "Why you're the best"),
        wishes.map(([e, t], i) =>
          h('div', { className: 'wish', key: i }, h('span', { className: 'emoji' }, e), h('p', null, t))))),
    h('footer', null, 'Made with love for Tega Oviri 💛'),
    secret && h(SecretModal, { onClose: () => setSecret(false), onToast: showToast }),
    toast && h('div', { className: 'toast', role: 'status' }, toast));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
